<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lo importante · Noticias de Bahía Blanca y el país</title>
<meta name="description" content="Las noticias que importan hoy en Bahía Blanca y el país, resumidas y con links a los diarios.">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FAFAF7; color: #18202C; font: 1.15rem/1.6 "Alegreya", Georgia, serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
  h1 { font: 800 3rem/1 "Archivo", sans-serif; font-stretch: 70%; margin: 0; }
  .fecha { font-family: "Archivo", sans-serif; color: #C1272D; font-weight: 600; margin: .4rem 0 1.5rem; }
  article { border-top: 1px solid #DEE1E6; padding: 1.5rem 0; }
  .cat { font: 600 .9rem "Archivo", sans-serif; color: #C1272D; }
  h2 { font: 700 1.5rem/1.2 "Archivo", sans-serif; font-stretch: 88%; margin: .2rem 0 .5rem; }
  p { margin: 0 0 .6rem; }
  .fuentes { font: .95rem "Archivo", sans-serif; color: #5B6472; }
  a { color: #24507A; }
  .error { background: #FDECEC; border: 1px solid #C1272D; padding: 1rem; font-family: "Archivo", sans-serif; }
</style>
</head>
<body>
<main>
  <h1>Lo importante</h1>
  <div class="fecha" id="fecha"></div>
  <div id="notas">Cargando…</div>
</main>

<script>
  var contenedor = document.getElementById("notas");

  function escapar(t) {
    return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function mostrarError(texto) {
    contenedor.innerHTML = '<div class="error"><b>No se pudieron cargar las noticias.</b><br>' + escapar(texto) + "</div>";
  }

  fetch("noticias.json?v=" + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error("noticias.json respondió " + r.status + " (¿está en la misma carpeta que index.html?)");
      return r.text();
    })
    .then(function (texto) {
      var datos;
      try { datos = JSON.parse(texto); }
      catch (e) { throw new Error("noticias.json no es un JSON válido: " + e.message); }

      // Acepta una lista de notas o un objeto con "notas"
      var notas = Array.isArray(datos) ? datos : (datos.notas || []);
      if (!notas.length) throw new Error("noticias.json no trae notas.");

      document.getElementById("fecha").textContent = datos.fecha ||
        new Date().toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });

      contenedor.innerHTML = notas.map(function (n) {
        var resumen = [].concat(n.resumen || []).map(function (p) { return "<p>" + escapar(p) + "</p>"; }).join("");
        var fuentes = (n.fuentes || []).map(function (f) {
          return '<a href="' + escapar(f.url) + '" target="_blank" rel="noopener">' + escapar(f.medio) + "</a>";
        }).join(", ");
        return "<article>" +
          '<div class="cat">' + escapar(n.categoria) + "</div>" +
          "<h2>" + escapar(n.titulo) + "</h2>" +
          resumen +
          (fuentes ? '<div class="fuentes">Leelo en ' + fuentes + "</div>" : "") +
          "</article>";
      }).join("");
    })
    .catch(function (e) { mostrarError(e.message); });
</script>
</body>
</html>
